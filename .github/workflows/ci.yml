name: Build-Test-Publish
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-test-publish-main
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore web application
        run: dotnet restore Indamin.Performance.Web.csproj
      - name: Build web application
        run: dotnet build Indamin.Performance.Web.csproj -c Release --no-restore
      - name: Restore tests
        run: dotnet restore EmployeePerformanceSystem.Tests/EmployeePerformanceSystem.Tests.csproj
      - name: Test
        run: dotnet test EmployeePerformanceSystem.Tests/EmployeePerformanceSystem.Tests.csproj -c Release --no-restore --verbosity normal
      - name: Publish self-contained
        run: dotnet publish Indamin.Performance.Web.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Package deployment artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Database | Out-Null
          Copy-Item publish package/Application -Recurse
          Copy-Item Database/* package/Database -Force
          @'
          # Employee Performance System - Deployment Package

          ## IIS
          1. Install the ASP.NET Core Hosting Bundle 10.x on the Windows Server. Visual Studio is not required.
          2. Copy `Application` to the IIS site directory.
          3. Set the IIS site's physical path to `Application`.
          4. Use an IIS Application Pool with `No Managed Code`.
          5. Configure the SQL Server connection string in `Application/appsettings.json`.
          6. Create the target database and run `Database/001_initial.sql`.
          7. Browse to the site and verify the login page.

          ## Accounts
          Administrator: `admin` / the value configured by `InitialAdminPassword`.
          Employee: Personnel Number / National ID.

          Employee accounts are created or updated during Excel employee import. Ordinary employees have read-only access to their own performance dashboard. Evaluators retain evaluation functions.
          '@ | Set-Content package/INSTALL.md -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: EmployeePerformanceSystem-win-x64
          path: package
          if-no-files-found: error
